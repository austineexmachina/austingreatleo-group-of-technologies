name: Deploy Austingreatleo Group to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: austingreatleo-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build website
        run: npm run build

      - name: Validate static output
        run: |
          test -d out
          test -f out/index.html
          echo "Static export verified."

      - name: Create Cloudflare Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN secret is empty or unavailable"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID secret is empty or unavailable"; exit 1)
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          CODE=$(curl -sS -o /tmp/cf-project.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE/austingreatleo-group")
          if [ "$CODE" = "404" ]; then
            CODE=$(curl -sS -o /tmp/cf-create.json -w "%{http_code}" -X POST "$BASE" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"austingreatleo-group","production_branch":"main"}')
          fi
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Cloudflare Pages API failed with HTTP $CODE"
            cat /tmp/cf-project.json 2>/dev/null || true
            cat /tmp/cf-create.json 2>/dev/null || true
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=austingreatleo-group --branch=main

      - name: Confirm deployment endpoint
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://austingreatleo-group.pages.dev/ -o /tmp/deployed-homepage.html
          grep -qi "Austingreatleo" /tmp/deployed-homepage.html
          echo "Deployment is live: https://austingreatleo-group.pages.dev"
